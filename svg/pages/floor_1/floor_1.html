<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Floor 1</title>
    <link rel="stylesheet" href="../styles.css">


</head>

<body>
    <img id="floorImage" src="" alt="Floor">
    <script src="../../../js/floorLoader.js"></script>
    <style>
        /* =====================================
   RESET
===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================
   CONTAINER
===================================== */

        .floor-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* =====================================
   FLOOR IMAGE
===================================== */

        #floorImage {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            user-select: none;
            pointer-events: none;
        }

        .unit {
            fill: transparent;
            stroke: transparent;
            cursor: pointer;
            pointer-events: all;
            transition: .2s;
        }

        .unit:hover {
            fill: rgba(37, 99, 235, .35);
        }



        /* =====================================
   SVG
===================================== */

        #floorSVG {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 10;
        }

        /* =====================================
   CLICKABLE AREAS
===================================== */

        #floorSVG path {

            fill: rgba(255, 255, 255, 0.001);

            stroke: transparent;

            stroke-width: 3;

            cursor: pointer;

            transition:
                fill .25s ease,
                stroke .25s ease,
                filter .25s ease,
                transform .25s ease;

        }

        /* =====================================
   HOVER
===================================== */

        #floorSVG path:hover {

            fill: rgba(255, 215, 0, .35);

            stroke: #FFD700;

            filter:
                drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 20px #FFD700);

        }

        /* =====================================
   CLICK
===================================== */

        #floorSVG path:active {

            fill: rgba(255, 215, 0, .6);

        }

        /* =====================================
   OPTIONAL BACK BUTTON
===================================== */

        .back-btn {

            position: absolute;

            top: 30px;
            left: 30px;

            padding: 12px 24px;

            background: white;

            color: black;

            text-decoration: none;

            border-radius: 10px;

            z-index: 100;

            font-weight: 600;

        }
    </style>


    <header>
        <h1>Interactive Floor Plan</h1>
        <div id="legend"></div>
    </header>
    <div id="timer">
        00:00
    </div>
    <div id="tooltip"></div>
    <div class="floor-container">

        <!-- Floor Plan Image -->
        <img src="Floor-01.png" id="floorImage" alt="Floor Plan">

        <!-- SVG Overlay -->
        <svg id="floorSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4967 2341"
            preserveAspectRatio="xMidYMid meet">

            <path id="1_AnchorStore_01" class="unit"
                d="m2102.61 871.63.19-94.09-1053.72-2.08-1.5 764.21 972.43 1.92.88-445.68-451.68-.89.1-46.31-207.26-.41.35-178.71z"
                class="st0" />

            <path id="1_Retail_Area_01" class="unit"
                d="m2668.7 1143.95-.66 336.01 265.31.52.72-362.66-61.54-.12.05-24.91-128.88-.25-.1 50.25s-75.76.51-74.89 1.16Z"
                class="st0" />

            <path id="1_Retail_Area_02" class="unit"
                d="m2934.06 1117.82-.71 362.66 350.65.69.75-375.77-178.24-.35.03-11.8-113.21-.22-.05 24.47z"
                class="st0" />

            <path id="1_Retail_Area_03" class="unit"
                d="m3277.62 1481.16-.13 63.35 391.3.78 1.55-784.31-1111.19-2.2-.22 111.86 539.34 1.07-.22 111.42 40.64.08-.14 67.72-31.64-.06-.37 42.38-.03 11.8 178.24.35-.75 375.77z"
                class="st0" />

        </svg>

    </div>


    <script>

</body>
