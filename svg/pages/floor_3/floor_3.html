<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Floor 3</title>

    <link rel="stylesheet" href="../styles.css">

</head>

<body>
    <style>
        /* =====================================
   RESET
===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .unit {
            fill: transparent;
            stroke: transparent;
            cursor: pointer;
            pointer-events: all;
            transition: .2s;
        }

        .unit:hover {
            fill: rgba(37, 99, 235, .35);
        }



        /* =====================================
   CONTAINER
===================================== */

        .floor-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* =====================================
   FLOOR IMAGE
===================================== */

        #floorImage {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            user-select: none;
            pointer-events: none;
        }

        /* =====================================
   SVG
===================================== */

        #floorSVG {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 10;
        }

        /* =====================================
   CLICKABLE AREAS
===================================== */

        #floorSVG path {

            fill: rgba(255, 255, 255, 0.001);

            stroke: transparent;

            stroke-width: 3;

            cursor: pointer;

            transition:
                fill .25s ease,
                stroke .25s ease,
                filter .25s ease,
                transform .25s ease;

        }

        /* =====================================
   HOVER
===================================== */

        #floorSVG path:hover {

            fill: rgba(255, 215, 0, .35);

            stroke: #FFD700;

            filter:
                drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 20px #FFD700);

        }

        /* =====================================
   CLICK
===================================== */

        #floorSVG path:active {

            fill: rgba(255, 215, 0, .6);

        }

        /* =====================================
   OPTIONAL BACK BUTTON
===================================== */

        .back-btn {

            position: absolute;

            top: 30px;
            left: 30px;

            padding: 12px 24px;

            background: white;

            color: black;

            text-decoration: none;

            border-radius: 10px;

            z-index: 100;

            font-weight: 600;

        }
    </style>


    <header>
        <h1>Interactive Floor Plan</h1>
        <div id="legend"></div>
    </header>
    <div id="timer">
        00:00
    </div>
    <div id="tooltip"></div>
    <div class="floor-container">

        <!-- Floor Plan Image -->
        <img src="Floor-03.png" id="floorImage" alt="Floor Plan">

        <!-- SVG Overlay -->
        <svg id="floorSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4967 2341"
            preserveAspectRatio="xMidYMid meet">

            <path id="3_ExibhitionHall" class="unit"
                d="M2514 1068.47v291.12h153.85v162.08h335.39c542.76-23 552.47-669.73 7.92-715h-22.9v142h27.82v62.11h-28.09v56.52l-474 1.17Z"
                class="st0" />

            <path id="3_FirtnessStudio" class="unit" d="M1954.41 811.89v263.77H2424V811.89s-468.68-.51-469.59 0"
                class="st0" />

            <path id="3_PartyHall" class="unit" d="M1204.33 806.67v213.27h217.34v43.73h464.41v468.89h-844.97V808.45z"
                class="st0" />


        </svg>

    </div>

    <script>
        window.unitDetails = {

            "3_ExibhitionHall": {
                unit: "Exhibition Hall",
                superArea: "7,228 sq.ft",
                carpetArea: "3,614 sq.ft"
            },

            "3_FirtnessStudio": {
                unit: "Fitness Studio",
                superArea: "2,026 sq.ft",
                carpetArea: "1,013 sq.ft"
            },

            "3_PartyHall": {
                unit: "Party Hall",
                superArea: "7,060 sq.ft",
                carpetArea: "3,530 sq.ft"
            }

        };
    </script>


    <script type="module" src="../../../js/database.js"></script>

    <script type="module" src="../../../js/visitor.js"></script>


    <script src="../floor-nav.js"></script>
</body>

</html>
