<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lower-Ground</title>
<link rel="stylesheet" href="../styles.css">
    

</head>

<body>
    <img id="floorImage" src="" alt="Floor">
    <script src="../../../js/floorLoader.js"></script>
    <style>
        /* =====================================
   RESET
===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================
   CONTAINER
===================================== */

        .floor-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* =====================================
   FLOOR IMAGE
===================================== */

        #floorImage {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            user-select: none;
            pointer-events: none;
        }

        /* =====================================
   SVG
===================================== */

        #floorSVG {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 10;
        }

        /* =====================================
   CLICKABLE AREAS
===================================== */

        #floorSVG path {

            fill: rgba(255, 255, 255, 0.001);

            stroke: transparent;

            stroke-width: 3;

            cursor: pointer;

            transition:
                fill .25s ease,
                stroke .25s ease,
                filter .25s ease,
                transform .25s ease;

        }

        /* =====================================
   HOVER
===================================== */

        #floorSVG path:hover {

            fill: rgba(255, 215, 0, .35);

            stroke: #FFD700;

            filter:
                drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 20px #FFD700);

        }

        /* =====================================
   CLICK
===================================== */

        #floorSVG path:active {

            fill: rgba(255, 215, 0, .6);

        }

        /* =====================================
   OPTIONAL BACK BUTTON
===================================== */

        .back-btn {

            position: absolute;

            top: 30px;
            left: 30px;

            padding: 12px 24px;

            background: white;

            color: black;

            text-decoration: none;

            border-radius: 10px;

            z-index: 100;

            font-weight: 600;

        }

        .unit {
            fill: transparent;
            stroke: transparent;
            cursor: pointer;
            pointer-events: all;
            transition: .2s;
        }

        .unit:hover {
            fill: rgba(37, 99, 235, .35);
        }
    </style>
    
   <header>
        <h1>Interactive Floor Plan</h1>
        <div id="legend"></div>
    </header>
    <div id="timer">
        00:00
    </div>
    <div id="tooltip"></div>
    <div class="floor-container">

        <!-- Floor Plan Image -->
        <img src="Lower-Ground.png" id="floorImage" alt="Floor Plan">

        <!-- SVG Overlay -->
        <svg id="floorSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4967 2341"
            preserveAspectRatio="xMidYMid meet">
            <path id="Proposal_For_Resturanet_Bar_1" class="unit" d="M684.67 1182.78v525.78h1128v-528.89z" />

            <path id="Proposal_For_Resturanet_Bar_2" class="unit" d="M2612.33 1170.5h428.11v542.28h-428.11z" />

            <path id="Proposal_For_Resturanet_Bar_3" class="unit"
                d="M3709.44 1146.11v566.67h-669V1170.5h554c40.36.27 78.4-9.1 115-24.39" />



        </svg>

    </div>

     

    <script src="../floor-nav.js"></script>
</body>

</html>
