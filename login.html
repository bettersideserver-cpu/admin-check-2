<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f4f6fb;
}

.container{
width:380px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:13px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

button{
width:100%;
padding:13px;
background:#2563eb;
border:none;
color:#fff;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

.switch{
margin-top:15px;
text-align:center;
}

.switch a{
cursor:pointer;
color:#2563eb;
text-decoration:none;
}

#registerForm{
display:none;
}

#error{
margin-top:15px;
text-align:center;
color:red;
}
</style>

</head>
<body>

<div class="container">

<h2>Admin Panel</h2>

<p id="error"></p>

<!-- LOGIN -->

<div id="loginForm">

<input
type="email"
id="loginEmail"
placeholder="Email Address">
<input
type="password"
id="loginPassword"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<p>
Don't have an account?

<a href="#" id="showRegister">
Register
</a>

</p>

</div>

<!-- REGISTER -->

<!-- REGISTER -->

<div id="registerForm" style="display:none;">

    <input
    type="text"
    id="registerName"
    placeholder="Full Name">

    <input
    type="email"
    id="registerEmail"
    placeholder="Email Address">

    <input
    type="password"
    id="registerPassword"
    placeholder="Password">

    <button id="registerBtn">
        Create Account
    </button>

    <p class="switch">
        Already have an account?
        <a href="#" id="showLogin">Login</a>
    </p>

</div>

<script src="js/auth.js"></script>

</body>
</html>
